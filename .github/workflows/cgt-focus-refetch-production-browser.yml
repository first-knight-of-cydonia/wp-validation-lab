# Validation trigger: 80f4feaa-6a92-44fa-b030-92e026b1f496
name: CGT Focus Refetch Production Browser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cgt-focus-refetch-production-browser.yml'

permissions:
  contents: read

concurrency:
  group: cgt-focus-refetch-production-browser
  cancel-in-progress: true

jobs:
  browser:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.0 / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        wordpress: [ '6.7.2', '7.0.3' ]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout isolated validation snapshot
        uses: actions/checkout@v5
        with:
          repository: first-knight-of-cydonia/validation-input
          ref: snapshot-current
          token: ${{ secrets.VALIDATION_INPUT_TOKEN }}
          path: input
          fetch-depth: 1
          persist-credentials: false

      - name: Verify snapshot boundary
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/input/.validation/manifest.json"
          validation_id="$(jq -er '.validation_id' "$manifest")"
          [[ "$(jq -er '.schema_version' "$manifest")" == '1' ]]
          test "$validation_id" = '80f4feaa-6a92-44fa-b030-92e026b1f496'
          test -f "$GITHUB_WORKSPACE/input/composer.json"
          test -f "$GITHUB_WORKSPACE/input/blocks/global-template/editor-refresh-coordinator.js"
          test -f "$GITHUB_WORKSPACE/input/tests/e2e/focus-refetch-production.js"
          printf 'validation_id=%s\n' "$validation_id" >> "$GITHUB_OUTPUT"
          rm -rf "$GITHUB_WORKSPACE/input/.git"
          echo "stage=snapshot result=PASS validation_id=$validation_id"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli
          tools: wp-cli, composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Install WordPress ${{ matrix.wordpress }}
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP_PATH"
          wp core download --version='${{ matrix.wordpress }}' --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url='http://127.0.0.1:8080' --title='CGT Focus Refetch Production Browser' --admin_user=admin --admin_password=admin --admin_email='admin@example.test' --skip-email
          wp config set WP_DEBUG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_PATH"
          echo "stage=wordpress-install result=PASS wordpress=${{ matrix.wordpress }}"

      - name: Install and activate production plugin snapshot
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress"
          PLUGIN_PATH="$WP_PATH/wp-content/plugins/croco-gutenberg-templates"
          rm -rf "$PLUGIN_PATH"
          mkdir -p "$PLUGIN_PATH"
          rsync -a --exclude='.validation/' --exclude='.test-results/' "$GITHUB_WORKSPACE/input/" "$PLUGIN_PATH/"
          composer install --working-dir="$PLUGIN_PATH" --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          wp plugin activate croco-gutenberg-templates --path="$WP_PATH"
          node --check "$PLUGIN_PATH/blocks/global-template/editor-refresh-coordinator.js"
          node --check "$PLUGIN_PATH/tests/e2e/focus-refetch-production.js"
          echo 'stage=plugin-activate result=PASS'

      - name: Run production Chromium assertions
        shell: bash
        env:
          CGT_FOCUS_BASE_URL: http://127.0.0.1:8080
          CGT_FOCUS_USER: admin
          CGT_FOCUS_PASSWORD: admin
          NODE_PATH: ${{ runner.temp }}/node_modules
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress"
          php -S 127.0.0.1:8080 -t "$WP_PATH" >"$RUNNER_TEMP/focus-refetch-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          curl --retry 3 --retry-connrefused --retry-delay 1 -fsS -o /dev/null 'http://127.0.0.1:8080/'
          node "$GITHUB_WORKSPACE/input/tests/e2e/focus-refetch-production.js" 2>&1 | tee "$RUNNER_TEMP/focus-refetch-production.log"
          grep -Fx 'FOCUS_REFETCH_PRODUCTION: PASS' "$RUNNER_TEMP/focus-refetch-production.log"

      - name: Reject PHP warnings and notices
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_LOG="$RUNNER_TEMP/wordpress/wp-content/debug.log"
          if [[ -f "$DEBUG_LOG" ]] && grep -E 'PHP (Warning|Notice)' "$DEBUG_LOG"; then
            exit 1
          fi

      - name: Final validation marker
        if: success()
        shell: bash
        env:
          VALIDATION_ID: ${{ steps.snapshot.outputs.validation_id }}
        run: |
          echo "validation_id=$VALIDATION_ID gate=focus-refetch-production-browser wordpress=${{ matrix.wordpress }} php=8.0 chromium=result-pass result=PASS"

      - name: Dump failure evidence
        if: failure()
        shell: bash
        run: |
          echo '--- E2E ---'
          cat "$RUNNER_TEMP/focus-refetch-production.log" 2>/dev/null || true
          echo '--- PHP server ---'
          cat "$RUNNER_TEMP/focus-refetch-server.log" 2>/dev/null || true
          echo '--- WordPress debug ---'
          cat "$RUNNER_TEMP/wordpress/wp-content/debug.log" 2>/dev/null || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focus-refetch-production-browser-${{ matrix.wordpress }}-failure
          path: |
            ${{ runner.temp }}/focus-refetch-production.log
            ${{ runner.temp }}/focus-refetch-server.log
            ${{ runner.temp }}/wordpress/wp-content/debug.log
          if-no-files-found: warn
          retention-days: 7
