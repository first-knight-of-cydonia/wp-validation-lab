name: P0 Migration Upgrade

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/p0-migration-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    name: WP ${{ matrix.wordpress }} / PHP 8.0
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - '6.7.2'
          - '7.0.4'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout sanitized private snapshot
        uses: actions/checkout@v5
        with:
          repository: first-knight-of-cydonia/validation-input
          ref: snapshot-current
          token: ${{ secrets.VALIDATION_INPUT_TOKEN }}
          path: input
          fetch-depth: 1
          persist-credentials: false

      - name: Verify snapshot boundary
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/input/.validation/manifest.json"
          validation_id="$(jq -er '.validation_id' "$manifest")"
          [[ "$(jq -er '.schema_version' "$manifest")" == '1' ]]
          [[ "$validation_id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]]
          printf 'validation_id=%s\n' "$validation_id" >> "$GITHUB_OUTPUT"
          rm -rf "$GITHUB_WORKSPACE/input/.git"
          echo "Snapshot boundary verified."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, ctype
          tools: wp-cli
          coverage: none

      - name: Install isolated WordPress fixture
        shell: bash
        run: |
          set -euo pipefail
          wp_path="$RUNNER_TEMP/wordpress"
          mkdir -p "$wp_path"
          {
            wp core download --version='${{ matrix.wordpress }}' --path="$wp_path" --force
            wp config create --path="$wp_path" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
            wp core install --path="$wp_path" --url='http://migration.example.test' --title='Validation Fixture' --admin_user=admin --admin_password=admin --admin_email='admin@example.test' --skip-email
            wp config set WP_DEBUG true --raw --path="$wp_path"
            wp config set WP_DEBUG_LOG true --raw --path="$wp_path"
            wp config set WP_DEBUG_DISPLAY false --raw --path="$wp_path"
          } >"$RUNNER_TEMP/install.log" 2>&1
          echo "WordPress fixture installed."

      - name: Execute migration assertions
        shell: bash
        env:
          VALIDATION_ID: ${{ steps.snapshot.outputs.validation_id }}
        run: |
          set -euo pipefail
          wp_path="$RUNNER_TEMP/wordpress"
          input="$GITHUB_WORKSPACE/input/spikes/migration-upgrade"
          plugin_path="$wp_path/wp-content/plugins/cgt-migration-upgrade-spike"
          raw="$RUNNER_TEMP/migration-raw.log"
          rm -rf "$plugin_path"
          cp -R "$input" "$plugin_path"

          stage() {
            local name="$1"
            shift
            if "$@" >>"$raw" 2>&1; then
              printf 'stage=%s result=PASS\n' "$name"
              return 0
            fi
            printf 'stage=%s result=FAIL\n' "$name"
            return 1
          }

          stage php_lint bash -c 'find "$1" -type f -name "*.php" -print0 | xargs -0 -n1 php -l' _ "$plugin_path"
          stage plugin_activate wp plugin activate cgt-migration-upgrade-spike --path="$wp_path"
          stage base_migration wp eval-file "$input/ci/run-tests.php" --path="$wp_path"
          stage integrity_hardening wp eval-file "$input/ci/run-integrity-hardening.php" --path="$wp_path"
          stage foreign_identity wp eval-file "$input/ci/run-foreign-identity.php" --path="$wp_path"
          stage post_backed_evidence wp eval-file "$input/ci/run-post-backed-reference-evidence.php" --path="$wp_path"
          stage pre_multisite_fixture wp eval-file "$input/ci/create-pre-multisite-fixture.php" --path="$wp_path"
          stage plugin_deactivate wp plugin deactivate cgt-migration-upgrade-spike --path="$wp_path"
          stage multisite_convert wp core multisite-convert --path="$wp_path" --title='Validation Network'

          if pre_site="$(wp site create --path="$wp_path" --slug=pre-activation --title='Pre Activation Site' --email='admin@example.test' --porcelain 2>>"$raw")" && [[ -n "$pre_site" ]]; then
            printf 'stage=pre_activation_site result=PASS\n'
          else
            printf 'stage=pre_activation_site result=FAIL\n'
            exit 1
          fi

          stage network_activate wp plugin activate cgt-migration-upgrade-spike --network --path="$wp_path"

          if post_site="$(wp site create --path="$wp_path" --slug=post-activation --title='Post Activation Site' --email='admin@example.test' --porcelain 2>>"$raw")" && [[ -n "$post_site" ]]; then
            printf 'stage=post_activation_site result=PASS\n'
          else
            printf 'stage=post_activation_site result=FAIL\n'
            exit 1
          fi

          stage multisite_assertions wp eval-file "$input/ci/run-multisite.php" --path="$wp_path"

          printf 'validation_id=%s gate=migration_upgrade wordpress=%s result=PASS\n' "$VALIDATION_ID" '${{ matrix.wordpress }}'
