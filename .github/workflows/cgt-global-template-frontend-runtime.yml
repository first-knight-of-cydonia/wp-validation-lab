# Validation trigger: 1c495f19-2c6f-4d00-bc28-def580929122
name: CGT Global Template Frontend Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cgt-global-template-frontend-runtime.yml'

permissions:
  contents: read

concurrency:
  group: cgt-global-template-frontend-runtime
  cancel-in-progress: true

jobs:
  runtime:
    name: WordPress 6.7.2 / PHP 8.0 / MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout isolated validation snapshot
        uses: actions/checkout@v5
        with:
          repository: first-knight-of-cydonia/validation-input
          ref: snapshot-current
          token: ${{ secrets.VALIDATION_INPUT_TOKEN }}
          path: input
          fetch-depth: 1
          persist-credentials: false

      - name: Verify snapshot boundary
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/input/.validation/manifest.json"
          validation_id="$(jq -er '.validation_id' "$manifest")"
          [[ "$(jq -er '.schema_version' "$manifest")" == '1' ]]
          [[ "$validation_id" =~ ^[0-9a-f-]{36}$ ]]
          test "$validation_id" = '1c495f19-2c6f-4d00-bc28-def580929122'
          test -f "$GITHUB_WORKSPACE/input/composer.json"
          test -f "$GITHUB_WORKSPACE/input/tests/runtime/global-template-frontend-production.php"
          printf 'validation_id=%s\n' "$validation_id" >> "$GITHUB_OUTPUT"
          rm -rf "$GITHUB_WORKSPACE/input/.git"
          echo "stage=snapshot result=PASS validation_id=$validation_id"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli
          tools: wp-cli, composer:v2
          coverage: none

      - name: Install WordPress 6.7.2
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP_PATH"
          wp core download --version='6.7.2' --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check
          wp core install --path="$WP_PATH" --url='http://127.0.0.1:8080' --title='CGT Global Template Runtime' --admin_user=admin --admin_password=admin --admin_email='admin@example.test' --skip-email
          wp config set WP_DEBUG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_LOG true --raw --path="$WP_PATH"
          wp config set WP_DEBUG_DISPLAY false --raw --path="$WP_PATH"
          echo 'stage=wordpress-install result=PASS wordpress=6.7.2'

      - name: Install and activate production plugin snapshot
        shell: bash
        run: |
          set -euo pipefail
          WP_PATH="$RUNNER_TEMP/wordpress"
          PLUGIN_PATH="$WP_PATH/wp-content/plugins/croco-gutenberg-templates"
          rm -rf "$PLUGIN_PATH"
          mkdir -p "$PLUGIN_PATH"
          rsync -a --exclude='.validation/' --exclude='.test-results/' "$GITHUB_WORKSPACE/input/" "$PLUGIN_PATH/"
          composer install --working-dir="$PLUGIN_PATH" --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          wp plugin activate croco-gutenberg-templates --path="$WP_PATH"
          echo 'stage=plugin-activate result=PASS'

      - name: Run frontend production assertions
        shell: bash
        run: |
          set -euo pipefail
          wp eval "require '$GITHUB_WORKSPACE/input/tests/runtime/global-template-frontend-production.php';" --path="$RUNNER_TEMP/wordpress" 2>&1 | tee "$RUNNER_TEMP/global-template-frontend-production.log"

      - name: Final validation marker
        if: success()
        shell: bash
        env:
          VALIDATION_ID: ${{ steps.snapshot.outputs.validation_id }}
        run: |
          echo "validation_id=$VALIDATION_ID gate=global-template-frontend-runtime wordpress=6.7.2 php=8.0 result=PASS"

      - name: Dump failure evidence
        if: failure()
        shell: bash
        run: |
          echo '--- fixture output ---'
          cat "$RUNNER_TEMP/global-template-frontend-production.log" 2>/dev/null || true
          echo '--- WordPress debug log ---'
          cat "$RUNNER_TEMP/wordpress/wp-content/debug.log" 2>/dev/null || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: global-template-frontend-production-runtime-failure
          path: |
            ${{ runner.temp }}/global-template-frontend-production.log
            ${{ runner.temp }}/wordpress/wp-content/debug.log
          if-no-files-found: warn
          retention-days: 7
