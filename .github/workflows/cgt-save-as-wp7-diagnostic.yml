name: CGT Save-as WP 7.0.3 Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cgt-save-as-wp7-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: cgt-save-as-wp7-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: WordPress 7.0.3 / Save-as checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout isolated validation snapshot
        uses: actions/checkout@v5
        with:
          repository: first-knight-of-cydonia/validation-input
          ref: snapshot-current
          token: ${{ secrets.VALIDATION_INPUT_TOKEN }}
          path: input
          fetch-depth: 1
          persist-credentials: false

      - name: Verify snapshot boundary
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/input/.validation/manifest.json"
          validation_id="$(jq -er '.validation_id' "$manifest")"
          [[ "$(jq -er '.schema_version' "$manifest")" == '1' ]]
          [[ "$validation_id" =~ ^[0-9a-f-]{36}$ ]]
          test -f "$GITHUB_WORKSPACE/input/tests/e2e/save-template-production.js"
          rm -rf "$GITHUB_WORKSPACE/input/.git"
          echo "stage=snapshot result=PASS validation_id=$validation_id"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, ctype
          tools: wp-cli
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Install WordPress 7.0.3 fixture
        shell: bash
        run: |
          set -euo pipefail
          wp_path="$RUNNER_TEMP/wordpress"
          mkdir -p "$wp_path"
          wp core download --version='7.0.3' --path="$wp_path" --force >/dev/null
          wp config create --path="$wp_path" --dbname=wordpress --dbuser=wordpress --dbpass=wordpress --dbhost=127.0.0.1:3306 --skip-check >/dev/null
          wp core install --path="$wp_path" --url='http://127.0.0.1:8080' --title='Validation Fixture' --admin_user=admin --admin_password=admin --admin_email='admin@example.test' --skip-email >/dev/null
          wp config set WP_DEBUG true --raw --path="$wp_path" >/dev/null
          wp config set WP_DEBUG_LOG true --raw --path="$wp_path" >/dev/null
          wp config set WP_DEBUG_DISPLAY false --raw --path="$wp_path" >/dev/null

      - name: Install production plugin snapshot
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/wordpress/wp-content/plugins/croco-gutenberg-templates"
          rm -rf "$plugin_dir"
          mkdir -p "$plugin_dir"
          rsync -a --exclude='.validation/' --exclude='.test-results/' "$GITHUB_WORKSPACE/input/" "$plugin_dir/"
          cd "$plugin_dir"
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader >/dev/null
          wp plugin activate croco-gutenberg-templates --path="$RUNNER_TEMP/wordpress" >/dev/null

      - name: Start WordPress server
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 -t "$RUNNER_TEMP/wordpress" >"$RUNNER_TEMP/php-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/php-server.pid"
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null 'http://127.0.0.1:8080/wp-login.php'; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Inspect WP 7.0.3 editor toolbar accessibility
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/node_modules
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('http://127.0.0.1:8080/wp-login.php');
            await page.locator('#user_login').fill('admin');
            await page.locator('#user_pass').fill('admin');
            await Promise.all([page.waitForNavigation(), page.locator('#wp-submit').click()]);
            await page.goto('http://127.0.0.1:8080/wp-admin/post-new.php');
            await page.waitForFunction(() => window.wp && window.wp.data && window.wp.plugins);
            await page.waitForTimeout(700);
            const welcome = page.getByRole('dialog', { name: 'Welcome to the block editor' });
            if (await welcome.isVisible().catch(() => false)) {
              await welcome.getByRole('button', { name: 'Close' }).click();
              await welcome.waitFor({ state: 'hidden' });
            }
            const buttons = await page.locator('button:visible').evaluateAll((nodes) => nodes.map((button) => ({
              text: (button.innerText || button.textContent || '').trim().replace(/\s+/g, ' '),
              ariaLabel: button.getAttribute('aria-label'),
              title: button.getAttribute('title'),
              ariaExpanded: button.getAttribute('aria-expanded'),
              ariaHaspopup: button.getAttribute('aria-haspopup'),
              className: button.className,
            })).filter((item) => item.ariaLabel || item.title || item.text));
            console.log('CGT_WP7_VISIBLE_BUTTONS=' + JSON.stringify(buttons));
            await browser.close();
          })().catch((error) => {
            console.error('CGT_WP7_INSPECT_FAIL=' + (error.message || String(error)));
            process.exit(1);
          });
          NODE

      - name: Run Save-as E2E and expose sanitized checkpoints
        shell: bash
        env:
          CGT_SAVE_TEMPLATE_BASE_URL: http://127.0.0.1:8080
          NODE_PATH: ${{ runner.temp }}/node_modules
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/save-template-e2e.log"
          if node "$GITHUB_WORKSPACE/input/tests/e2e/save-template-production.js" >"$log" 2>&1; then
            grep -E '^(PASS:|FAIL:)' "$log" || true
            echo 'stage=save-template-e2e result=PASS wordpress=7.0.3'
            exit 0
          fi
          grep -E '^(PASS:|FAIL:)' "$log" || true
          echo 'stage=save-template-e2e result=FAIL wordpress=7.0.3'
          exit 1

      - name: Stop WordPress server
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/php-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/php-server.pid")" 2>/dev/null || true
          fi
